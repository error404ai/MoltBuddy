services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: moltbuddy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moltbuddy_db
      MYSQL_USER: moltbuddy
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moltbuddy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: moltbuddy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - moltbuddy-network

  # Backend Development Server
  backend:
    image: node:20-alpine
    container_name: moltbuddy-backend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: moltbuddy
      DB_PASSWORD: password
      DB_NAME: moltbuddy_db
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - moltbuddy-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "npm install -g pnpm && pnpm install && pnpm run dev:server"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3001/",
        ]
      timeout: 10s
      retries: 5
      interval: 30s

  # Frontend Development Server
  frontend:
    image: node:20-alpine
    container_name: moltbuddy-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - moltbuddy-network
    depends_on:
      - backend
    command: sh -c "npm install -g pnpm && pnpm install && pnpm run dev:client -- --host 0.0.0.0"

volumes:
  mysql_data:
    driver: local

networks:
  moltbuddy-network:
    driver: bridge
