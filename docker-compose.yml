services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moltbuddy-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moltbuddy-network

  db:
    image: mysql:8.0
    container_name: moltbuddy-mysql-dev
    restart: unless-stopped
    ports:
      - "${MYSQL_EXTERNAL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moltbuddy_db}
      MYSQL_USER: ${MYSQL_USER:-moltbuddy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moltbuddy-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: moltbuddy-phpmyadmin-dev
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-moltbuddy}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-password}
      UPLOAD_LIMIT: 100M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - moltbuddy-network

volumes:
  mysql_data:

networks:
  moltbuddy-network:
    driver: bridge
