# ===========================================
# Production Docker Compose
# Optimized for VPS deployment
# ===========================================

services:
  # =====================
  # Database Services
  # =====================
  mysql:
    image: mysql:8.0
    container_name: moltbuddy-mysql-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    networks:
      - moltbuddy-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # =====================
  # API Service
  # =====================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: moltbuddy-api-prod
    restart: always
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    expose:
      - "8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - moltbuddy-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # =====================
  # Dashboard Service (Static files served by Nginx)
  # =====================
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile.prod
    container_name: moltbuddy-dashboard-prod
    restart: always
    expose:
      - "3000"
    networks:
      - moltbuddy-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # =====================
  # Nginx Reverse Proxy
  # =====================
  nginx:
    image: nginx:alpine
    container_name: moltbuddy-nginx-prod
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/logs:/var/log/nginx
    depends_on:
      - api
      - dashboard
    networks:
      - moltbuddy-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # =====================
  # Redis (Optional - for caching/sessions)
  # =====================
  redis:
    image: redis:7-alpine
    container_name: moltbuddy-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    volumes:
      - redis_data:/data
    networks:
      - moltbuddy-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

networks:
  moltbuddy-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
